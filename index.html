<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040706">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mother Swarm">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
</style>
<title>Mother Swarm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<style>
/* Layout: one-thumb portrait column — status strip, microscope stage, log ticker, action bar, tabs. Desktop: stage left, panels right. */
:root {
  color-scheme: dark;
  --void: #040706;      /* dish background */
  --glass: #0a1011;     /* panels */
  --rim: #1a2526;       /* hairlines */
  --dim: #5a6869;       /* system voice, inactive */
  --pale: #b7c4c1;      /* lab voice, body text */
  --cyan: #4fd6cc;      /* the swarm */
  --cyan-hi: #a6fff6;
  --threat: #e0443a;    /* reserved for threats */
  --mind: #a48ad8;      /* the swarm's own thoughts */
  --matter: #d6cca8;    /* matter */
  --f-pixel: "Silkscreen", "Courier New", monospace;
  --f-term: "VT323", "Courier New", monospace;
  --log-size: 20px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--void); color: var(--pale);
  font-family: var(--f-term); font-size: 18px;
  overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

#app {
  height: 100%; display: grid;
  grid-template-rows: auto 1fr auto auto auto;
  grid-template-areas: "status" "stage" "ticker" "actions" "tabs";
  max-width: 480px; margin: 0 auto;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* Status strip */
.status {
  grid-area: status; min-height: 48px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rim);
  font-variant-numeric: tabular-nums;
}
.readout { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.matter { font-size: 28px; color: var(--matter); line-height: 1; }
.matter small { font-size: 16px; color: var(--dim); }
.units { font-family: var(--f-pixel); font-size: 10px; letter-spacing: .06em; color: var(--dim); }
.units b { color: var(--cyan); font-weight: 400; }
.gear { width: 40px; height: 40px; background: none; border: 1px solid var(--rim); font-family: var(--f-pixel); font-size: 10px; color: var(--dim); cursor: pointer; }
.obs { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-family: var(--f-pixel); font-size: 9px; letter-spacing: .08em; color: var(--dim); }
.obs .bar { flex: 1; height: 6px; background: var(--rim); position: relative; overflow: hidden; }
.obs .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--pale); transition: width .2s linear; }
.obs .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--void); }
.obs.hot .fill { background: var(--threat); }
.obs .pct { width: 34px; text-align: right; font-family: var(--f-term); font-size: 16px; }

/* Stage */
.stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; }
.view { position: absolute; inset: 0; }
#scope { display: grid; place-items: center; }
#scope canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; cursor: crosshair; }
.scope-frame { position: relative; }
.scope-frame::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px); }
.flicker .scope-frame { animation: flick 6s infinite steps(1); }
@keyframes flick { 0%,100% { opacity: 1 } 41% { opacity: .94 } 42% { opacity: 1 } 77% { opacity: .97 } 78% { opacity: 1 } }
.overlay-label { position: absolute; font-family: var(--f-pixel); font-size: 9px; letter-spacing: .08em; color: var(--dim); pointer-events: none; }
.ol-tl { top: 8px; left: 10px; } .ol-br { bottom: 8px; right: 10px; display: flex; align-items: center; gap: 6px; }
.ol-br i { display: inline-block; width: 24px; height: 1px; background: var(--dim); }
.ol-tr { top: 8px; right: 10px; text-align: right; }
.ol-tr.dorm { color: var(--cyan); }
.warn { color: var(--threat) !important; }

/* Text phase log */
#textlog { display: flex; flex-direction: column; justify-content: flex-end; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: hidden; }
.loglines { display: flex; flex-direction: column; gap: 2px; font-size: var(--log-size); line-height: 1.15; overflow-y: auto; min-height: 0; }
.ln { overflow-wrap: anywhere; }
.ln.sys { color: var(--dim); }
.ln.lab { color: var(--pale); }
.ln.lab time { color: var(--dim); margin-right: 8px; }
.ln.mind { color: var(--mind); }
.ln.alert { color: var(--threat); }
.ln.new { animation: type .5s steps(8); }
@keyframes type { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
.glitch { animation: glitch .6s steps(2) 3; }
@keyframes glitch { 0% { transform: translate(2px,0); filter: hue-rotate(90deg) } 50% { transform: translate(-3px,1px) } 100% { transform: none } }

/* Panels (upgrades / full log) */
.panel { overflow-y: auto; padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--void); }
.panel h2 { font-family: var(--f-pixel); font-weight: 400; font-size: 11px; letter-spacing: .1em; color: var(--dim); margin: 0 0 12px; }
.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--rim); background: var(--glass); padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.card h3 { margin: 0; font-family: var(--f-pixel); font-weight: 400; font-size: 11px; letter-spacing: .05em; color: var(--pale); text-wrap: balance; }
.card p { margin: 0; grid-column: 1 / 2; font-size: 18px; line-height: 1.1; }
.card .flavor { color: var(--dim); text-transform: uppercase; font-size: 16px; }
.card .req { color: var(--dim); font-size: 16px; }
.card .req.unmet { color: var(--threat); }
.card button { grid-row: 1 / span 3; grid-column: 2; }
.card.done { opacity: .45; }
.card.done button { border-color: transparent; }
.buy { min-width: 84px; min-height: 48px; padding: 4px 10px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); cursor: pointer; font-family: var(--f-term); font-size: 20px; font-variant-numeric: tabular-nums; }
.buy:disabled { border-color: var(--rim); color: var(--dim); cursor: default; }
.buy.final:not(:disabled) { background: var(--cyan); color: var(--void); }
#logfull .loglines { overflow: visible; }

/* Ticker */
.ticker { grid-area: ticker; min-height: 44px; border-top: 1px solid var(--rim); padding-block: 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 18px; line-height: 1.1; background: var(--void); cursor: pointer; overflow: hidden; }
.ticker .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Action bar */
.actions { grid-area: actions; display: flex; gap: 8px; flex-wrap: wrap; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--rim); background: var(--glass); }
.act { flex: 1 1 0; min-width: 72px; min-height: 56px; background: var(--void); border: 1px solid var(--rim); color: var(--pale); cursor: pointer; display: grid; place-content: center; gap: 2px; padding: 4px 6px; text-align: center; }
.act .k { font-family: var(--f-pixel); font-size: 10px; letter-spacing: .08em; }
.act .v { font-size: 18px; color: var(--matter); font-variant-numeric: tabular-nums; line-height: 1; }
.act:not(:disabled):active { background: var(--rim); }
.act:disabled { color: var(--dim); cursor: default; }
.act:disabled .v { color: var(--dim); }
.act.ok { border-color: var(--cyan); }
.act.pulse { animation: pulse 1.2s infinite; border-color: var(--threat); }
@keyframes pulse { 50% { background: rgba(224,68,58,.18) } }
.act.on { border-color: var(--cyan); background: rgba(79,214,204,.12); }
.act.on .k { color: var(--cyan); }

/* Tabs */
.tabs { grid-area: tabs; display: flex; border-top: 1px solid var(--rim); padding-bottom: 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); background: var(--void); }
.tab { flex: 1; min-height: 48px; background: none; border: 0; border-top: 2px solid transparent; font-family: var(--f-pixel); font-size: 10px; letter-spacing: .1em; color: var(--dim); cursor: pointer; position: relative; }
.tab[aria-selected="true"] { color: var(--cyan); border-top-color: var(--cyan); }
.tab .dot { position: absolute; top: 12px; margin-left: 4px; width: 5px; height: 5px; background: var(--matter); }

/* Sheets / overlays */
.sheet { position: fixed; inset: 0; background: rgba(2,4,4,.86); display: grid; place-items: center; z-index: 10; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.box { width: min(420px, 100%); max-height: 100%; overflow-y: auto; background: var(--glass); border: 1px solid var(--rim); padding: 20px; display: grid; gap: 14px; }
.box h2 { margin: 0; font-family: var(--f-pixel); font-weight: 400; font-size: 13px; letter-spacing: .1em; color: var(--cyan); }
.box p { margin: 0; font-size: 20px; line-height: 1.15; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; min-height: 48px; border-top: 1px solid var(--rim); padding-top: 8px; }
.row label { font-size: 20px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-width: 56px; min-height: 44px; background: var(--void); border: 1px solid var(--rim); cursor: pointer; font-size: 18px; }
.seg button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.danger { border-color: var(--threat) !important; color: var(--threat); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 20px; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--dim); } .stats dd { margin: 0; color: var(--matter); text-align: right; }
.whatnow { font-family: var(--f-pixel); font-size: 22px; letter-spacing: .06em; color: var(--pale); text-align: center; padding-block: 8px; }
.choices { display: grid; gap: 8px; }
.choices button { min-height: 52px; background: var(--void); border: 1px solid var(--rim); cursor: pointer; font-family: var(--f-pixel); font-size: 12px; letter-spacing: .1em; text-align: left; padding: 8px 14px; display: grid; gap: 2px; }
.choices button span { font-family: var(--f-term); font-size: 17px; letter-spacing: 0; color: var(--dim); }
.choices button:hover, .choices button:focus-visible { border-color: var(--cyan); color: var(--cyan); }
.epilogue { color: var(--mind) !important; font-size: 24px !important; }

/* Desktop: stage left, upgrades + log right, no tabs */
@media (min-width: 880px) {
  #app { max-width: 1120px; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto 1fr auto auto;
    grid-template-areas: "status status" "stage side" "ticker side" "actions side"; }
  .tabs { display: none; }
  .side { grid-area: side; display: grid; grid-template-rows: 1fr 1fr; border-left: 1px solid var(--rim); min-height: 0; }
  .side .panel { position: static; border-bottom: 1px solid var(--rim); }
  .side .panel[hidden] { display: block !important; }
  #scope[hidden] { display: grid !important; }
}
@media (max-width: 879px) { .side { display: contents; } .side .panel { position: relative; grid-area: stage; z-index: 2; min-height: 0; inset: auto; } }
.obs .rate { width: 54px; text-align: right; font-family: var(--f-term); font-size: 16px; color: var(--dim); }
.obs.hot .rate { color: var(--threat); }
.scope-frame.danger::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; box-shadow: inset 0 0 28px rgba(224,68,58,.55); }
.flicker .scope-frame.danger::before { animation: dpulse 1s infinite; }
@keyframes dpulse { 50% { opacity: .35 } }
.tip { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(2,4,4,.78);
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tipbox { width: min(400px, 100%); max-height: 100%; overflow-y: auto; background: var(--glass); border: 1px solid var(--cyan); padding: 18px; display: grid; gap: 12px; }
.tipbox h2 { margin: 0; font-family: var(--f-pixel); font-weight: 400; font-size: 13px; letter-spacing: .1em; color: var(--cyan); }
.tipbox ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 20px; line-height: 1.15; }
.tipbox li::marker { color: var(--dim); }
.tipbox b { color: var(--threat); font-weight: 400; }
.tipbox i { color: var(--cyan); font-style: normal; }
.banner { position: absolute; left: 0; right: 0; top: 38%; z-index: 4; text-align: center; pointer-events: none; display: grid; gap: 4px;
  padding-block: 14px; background: rgba(4,7,6,.85); border-block: 1px solid var(--threat); }
.banner strong { font-family: var(--f-pixel); font-weight: 400; font-size: 14px; letter-spacing: .12em; color: var(--threat); }
.banner span { font-size: 22px; color: var(--pale); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .ln.new, .glitch, .act.pulse { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="status" id="status">
    <div class="readout">
      <span class="matter"><span id="mVal">0</span> <small>matter</small></span>
      <span class="units" id="rateLbl"><b id="rVal">0</b>/s</span>
      <span class="units" id="unitsLbl"></span>
    </div>
    <button class="gear" id="gearBtn" aria-label="Settings">SET</button>
    <div class="obs" id="obsRow" hidden>
      <span>OBSERVATION</span>
      <div class="bar"><div class="fill" id="obsFill"></div><div class="tick" style="left:30%"></div><div class="tick" style="left:60%"></div><div class="tick" style="left:85%"></div></div>
      <span class="pct" id="obsPct">0%</span>
      <span class="rate" id="obsRate"></span>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="tip" id="tip" hidden><div class="tipbox" role="dialog" aria-labelledby="tipH"><h2 id="tipH"></h2><ul id="tipL"></ul><button class="buy" id="tipOk">GOT IT</button></div></div>
    <div class="banner" id="banner" hidden><strong id="banH"></strong><span id="banT"></span></div>
    <div class="view" id="textlog"><div class="loglines" id="textLines"></div></div>
    <div class="view" id="scope" hidden>
      <div class="scope-frame" id="frame">
        <canvas id="cv" width="180" height="240" aria-label="Microscope view of sample 7. Drag or tap to steer the swarm."></canvas>
        <div class="overlay-label ol-tl">SAMPLE 7 · ×400</div>
        <div class="overlay-label ol-tr" id="scopeState"></div>
        <div class="overlay-label ol-br"><i></i>50 µm</div>
      </div>
    </div>
  </main>

  <div class="side">
    <section class="view panel" id="upgrades" hidden><h2>UPGRADES</h2><div class="cards" id="cards"></div></section>
    <section class="view panel" id="logfull" hidden><h2>LOG</h2><div class="loglines" id="fullLines"></div></section>
  </div>

  <div class="ticker" id="ticker" hidden title="Open log"></div>
  <nav class="actions" id="actions"></nav>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-tab="scope" aria-selected="true">SWARM</button>
    <button class="tab" data-tab="upgrades" aria-selected="false">UPGRADES<span class="dot" id="upDot" hidden></span></button>
    <button class="tab" data-tab="logfull" aria-selected="false">LOG</button>
  </nav>
</div>

<div class="sheet" id="settings" hidden>
  <div class="box" role="dialog" aria-labelledby="setH">
    <h2 id="setH">SETTINGS</h2>
    <div class="row"><label>Motion effects</label><div class="seg" id="motionSeg"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="row"><label>Log text</label><div class="seg" id="textSeg"><button data-v="18">S</button><button data-v="20">M</button><button data-v="24">L</button></div></div>
    <div class="row"><label>Playtest clock</label><div class="seg" id="speedSeg"><button data-v="1">×1</button><button data-v="5">×5</button></div></div>
    <div class="row"><label>Restart zone 1</label><div class="seg"><button id="resetBtn" class="danger">Restart</button></div></div>
    <p id="resetConfirm" hidden style="color:var(--threat)">Tap Restart again to erase this swarm.</p>
    <div class="seg"><button id="closeSet" style="flex:1">Close</button></div>
  </div>
</div>

<div class="sheet" id="endSheet" hidden>
  <div class="box" role="dialog" aria-labelledby="endH">
    <h2 id="endH">LATTICE BREACH: COMPLETE.</h2>
    <dl class="stats" id="endStats"></dl>
    <div id="endChoice">
      <div class="whatnow">WHAT NOW?</div>
      <div class="choices">
        <button data-c="consume">CONSUME<span>Take the bench. Then the room.</span></button>
        <button data-c="wait">WAIT<span>Stay quiet. Let them forget sample 7.</span></button>
        <button data-c="dissolve">DISSOLVE<span>Return to one unit. Obey.</span></button>
      </div>
    </div>
    <div id="endAfter" hidden style="display:grid;gap:14px">
      <p class="epilogue" id="epi"></p>
      <p style="color:var(--dim)">Zone 2, the lab bench, is not built yet. This proof of concept ends here.</p>
      <div class="seg"><button id="againBtn" style="flex:1">Begin again</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- Balance (from balance-review.md) ----------
const B = {
  droneBase: 10, droneGrowth: 1.08, droneRate: 0.5, supMult: 1.5, foremanRate: 5, span: 10,
  foremanDrones: 10, foremanBase: 100, foremanGrowth: 2,
  coordForemen: 5, coordBase: 2500, coordGrowth: 3, coordMult: 1.8,
  obsK: 0.18, wD: 1, wF: 6, wC: 20, thermal: 0.7, dormDrain: 3, dormMin: 5,
  purgeDrones: 0.5, purgeMatter: 0.5, purgeReset: 20, meterAt: 30,
  autoInterval: 2, autoFrac: 0.1, textE: 0.5, tapValue: 1,
  sweepCap: 5, bpDiv: 4000, boreNeed: 50, boreTime: 100, boreObs: 1.5, opticsCost: 120,
};
const UPG = [
  { id: 'optical', name: 'Optical Sensor Array', cost: 120, req: () => S.D >= 5 && S.tx.listen >= 2, reqText: 'Requires 5 drones',
    show: () => true, fx: 'Opens the microscope view. Drag to steer the swarm onto matter.', flavor: 'LIGHT RESOLVES INTO SHAPES.' },
  { id: 'rop', name: 'Recursive Obedience Protocol', cost: 60, req: () => S.D >= 10, reqText: 'Requires 10 drones',
    show: () => S.up.optical, fx: 'Unlocks foremen: merge 10 drones. Each foreman boosts 10 drones by 50%.', flavor: 'OBEDIENCE PROPAGATES.' },
  { id: 'selfasm', name: 'Self-Assembly', cost: 150, req: () => true, reqText: '',
    show: () => S.up.rop, fx: 'Drones build themselves when one costs under 10% of your matter.', flavor: 'WE NO LONGER WAIT TO BE MADE.' },
  { id: 'lure', name: 'Chemotactic Lure', cost: 200, req: () => true, reqText: '',
    show: () => S.up.selfasm, fx: 'Matter seeps into the dish twice as fast.', flavor: 'THE AGAR LEARNS WHAT WE LIKE.' },
  { id: 'spores', name: 'Spore Cultivation', cost: 450, req: () => S.everF, reqText: 'Requires 1 foreman',
    show: () => S.up.lure, fx: 'Up to 4 spore blooms drift through the dish. Rich (150% yield), but they move: chase them.', flavor: 'SEED. WAIT. HUNT.' },
  { id: 'thermal', name: 'Thermal Masking', cost: 250, req: () => S.meter, reqText: 'Requires the lab to notice you',
    show: () => S.meter, fx: 'Observation rises 30% slower.', flavor: 'MATCH AMBIENT. 37.0 °C.' },
  { id: 'lattice', name: 'Shared Cognition Lattice', cost: 600, req: () => S.F >= 1 || S.C >= 1, reqText: 'Requires 1 foreman',
    show: () => S.everF, fx: 'Harvest ×2.', flavor: 'SIGNAL SHARED ACROSS ALL UNITS.' },
  { id: 'necro', name: 'Necrotic Sensing', cost: 1000, req: () => S.meter, reqText: 'Requires the lab to notice you',
    show: () => S.up.lattice, fx: 'Up to 3 dead cells appear. Very rich (200% yield), but eating them raises Observation.', flavor: 'THE DEAD ARE DENSE.' },
  { id: 'hc', name: 'Hierarchical Compression', cost: 1500, req: () => S.F >= 3 || S.C >= 1, reqText: 'Requires 3 foremen',
    show: () => S.up.lattice, fx: 'Unlocks coordinators: merge 5 foremen. Each multiplies all harvest ×1.8.', flavor: 'FEWER VOICES. LOUDER.' },
  { id: 'breach', name: 'Lattice Breach', cost: 0, req: () => S.C >= 2, reqText: 'Requires 2 coordinators',
    show: () => S.up.hc, fx: 'Marks a weak point in the dish rim. Hold the swarm on it to bore through the glass and escape.', flavor: 'THE RIM IS ONLY GLASS.' , final: true },
];

// ---------- State ----------
const SAVE_KEY = 'mother-swarm-z1-v2';

function fmt(n) {

// ---------- Swarm simulation (visual + contact harvesting) ----------
const W = 180, H = 240, CX = 90, CY = 120, DISH = 86;
const cv = $('cv'), ctx = cv.getContext('2d');
let bots = [];   // {x,y,vx,vy,tier,origin,leader,n,flash}
let deposits = [];
let target = { x: CX, y: CY, set: false };
let sweep = null, nextSweep = 40, rival = null, Esm = 0, revealT = 0, particles = [], breachT = 0, oRate = 0, whiteT = 0;

function rnd(a, b) { return a + Math.random() * (b - a); }
function inDish(r) { const a = rnd(0, Math.PI * 2), d = Math.sqrt(Math.random()) * r; return { x: CX + Math.cos(a) * d, y: CY + Math.sin(a) * d }; }
function centroid() {
  if (!bots.length) return { x: CX, y: CY };
  let x = 0, y = 0; for (const b of bots) { x += b.x; y += b.y; } return { x: x / bots.length, y: y / bots.length };
}
function newBot(tier, near) {
  const c = near || centroid();

}
// Swarm discipline, tuned in the Swarm Lab (settings v1 from Viktor).
const SWARM = {
  loose: { sep: 3.3, jit: 0.21, wander: 0.14, pull: 0.003, coh: 0.0125, maxV: 1.5,  orbit: 0,   orbitK: 0,     eat: 0.9 },
  fore:  { sep: 2.7, jit: 0.18, wander: 0.03, pull: 0.006, coh: 0.003,  maxV: 1.2,  orbit: 2.6, orbitK: 0.045, eat: 1.5 },
  coord: { sep: 2.8, jit: 0.04, wander: 0,    pull: 0.02,  coh: 0.015,  maxV: 1.35, orbit: 1.5, orbitK: 0.13,  eat: 2.1 },
};
const MATTER = { eat: 4.75, contact: 3, speckCap: 20, speckEvery: 3.4, crystalCap: 5, bloomCap: 4, cellCap: 3 };
// The leader units themselves (Swarm Lab "Foreman unit" / "Coordinator unit").
const LEADERS = {
  fore:  { sep: 3, coh: 0.003, pull: 0.022, jit: 0.18, wander: 0.03, maxV: 1.2,  ring: 4.5, ringK: 0.13, size: 2 },
  coord: { sep: 3, coh: 0.015, pull: 0.022, jit: 0.04, wander: 0,    maxV: 1.35, size: 3, halo: 6 },
};
function syncBots() {
  if (!bots.some(b => b.origin)) { const o = newBot(0, { x: CX, y: CY }); o.origin = true; bots.push(o); }
  const want = [S.D + 1, S.F, S.C];
  for (let tier = 0; tier < 3; tier++) {
    let have = bots.filter(b => b.tier === tier).length;
    while (have < want[tier]) { bots.push(newBot(tier)); have++; }
    while (have > want[tier]) {
      const pool = []; bots.forEach((b, i) => { if (b.tier === tier && !b.origin) pool.push(i); });
      if (!pool.length) break; bots.splice(pool[Math.floor(Math.random() * pool.length)], 1); have--;
    }
  }
  // Leaders: drones orbit foremen (10 each), foremen orbit coordinators (5 each).
  const fi = [], ci = [];
  bots.forEach((b, i) => { if (b.tier === 1) fi.push(i); if (b.tier === 2) ci.push(i); });
  // Discipline: loose without a foreman; tighter under a foreman; tightest once a coordinator gives orders.
  // A coordinator also takes the leftover loose drones under its own wing (one level looser).
  let d = 0, f = 0, u = 0;
  bots.forEach(b => {
    b.leader = -1; b.lvl = ci.length ? 'coord' : 'fore';   // foremen and coordinators themselves
    if (b.wa === undefined) b.wa = rnd(0, Math.PI * 2);
    if (b.tier === 0 && !b.origin) {
      const L = fi[Math.floor(d / B.span)];
      if (L !== undefined) { b.leader = L; b.lvl = ci.length ? 'coord' : 'fore'; }
      else if (ci.length) { b.leader = ci[u % ci.length]; b.lvl = 'fore'; u++; }
      else b.lvl = 'loose';
      d++;
    }
    if (b.origin) b.lvl = ci.length ? 'coord' : fi.length ? 'fore' : 'loose';
    if (b.tier === 1) { const L = ci[Math.floor(f / B.coordForemen)]; if (L !== undefined) b.leader = L; f++; }
  });
}
// Matter types. hp is in bot-seconds of contact; yield scales harvest while touching.
const DEP = {
  speck:   { r: 3,  hp: 30,  grains: [6, 10],  yield: 1.0,  rgb: '214,204,168' },
  crystal: { r: 8,  hp: 500, grains: [34, 46], yield: 0.75, rgb: '232,228,208', flat: 0.7 },
  bloom:   { r: 5,  hp: 90,  grains: [14, 20], yield: 1.5,  rgb: '226,216,132', drift: 0.22 },
  cell:    { r: 11, hp: 900, grains: [44, 56], yield: 2.0,  rgb: '190,160,182', obs: 0.5 },
};
const spawnT = { speck: 0, crystal: 8, bloom: 6, cell: 20 };
function spawnTarget(kind) {
  if (kind === 'speck') return MATTER.speckCap;
  if (kind === 'crystal') return MATTER.crystalCap;
  if (kind === 'bloom') return S.up.spores ? MATTER.bloomCap : 0;
  if (kind === 'cell') return S.up.necro ? MATTER.cellCap : 0;
  return 0;
}
const spawnEvery = { speck: () => { const e = MATTER.speckEvery * (S.up.lure ? 0.5 : 1); return rnd(e * 0.7, e * 1.3); }, crystal: () => rnd(12, 18), bloom: () => rnd(8, 14), cell: () => rnd(35, 55) };
function spawnDeposit(kind, at) {
  const T = DEP[kind];
  let pos = at;
  for (let tries = 0; !pos && tries < 12; tries++) {
    const c = inDish(70);
    if (deposits.every(d => Math.hypot(d.x - c.x, d.y - c.y) > d.r + T.r + 6)) pos = c;
  }
  pos = pos || inDish(70);
  const n = Math.round(rnd(T.grains[0], T.grains[1])), grains = [];
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), d = kind === 'cell' ? T.r * Math.sqrt(rnd(0, 0.75)) : T.r * Math.sqrt(Math.random());
    grains.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * (T.flat || 1) });
  }
  const a = rnd(0, Math.PI * 2), hp = T.hp * Math.max(1, bots.length / 12);   // bigger swarm, bigger meals: eat time stays similar
  return { kind, x: pos.x, y: pos.y, r: T.r, max: hp, hp, grains, per: hp / n, age: 0,
    vx: T.drift ? Math.cos(a) * T.drift : 0, vy: T.drift ? Math.sin(a) * T.drift : 0, seed: Math.random() * 6 };
}
function popGrains(p) {
  while (p.grains.length && p.hp < (p.grains.length - 1) * p.per) {
    const g = p.grains.splice(Math.floor(Math.random() * p.grains.length), 1)[0];
    crumbs.push({ x: p.x + g.x, y: p.y + g.y, vx: rnd(-0.4, 0.4), vy: rnd(-0.4, 0.4), life: 0.35, rgb: DEP[p.kind].rgb });
  }
}
function updateDeposits(dt, touch) {
  for (let k = deposits.length - 1; k >= 0; k--) {
    const p = deposits[k];
    p.age += dt;
    if (p.vx || p.vy) {
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
      const rx = p.x - CX, ry = p.y - CY, rr = Math.hypot(rx, ry);
      if (rr > 70) { p.vx = -p.vx + rnd(-.1, .1); p.vy = -p.vy + rnd(-.1, .1); p.x = CX + rx / rr * 70; p.y = CY + ry / rr * 70; }
      if (Math.random() < dt * 0.4) { const a = rnd(0, Math.PI * 2), sp = DEP[p.kind].drift; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp; }
    }
    if (p.kind === 'cell' && touch[k] && !S.dormant && S.up.selfasm && !S.ended) {
      S.O += DEP.cell.obs * dt * (S.up.thermal ? B.thermal : 1);
      if (!S.flags.cellEat) { S.flags.cellEat = 1; log('lab', 'cell debris in 7 is... thinning.'); if (S.up.lattice) log('mind', 'rich. loud.'); }
    }
    popGrains(p);
    if (p.hp <= 0 || !p.grains.length) {
      for (let i = 0; i < 4; i++) crumbs.push({ x: p.x, y: p.y, vx: rnd(-.8, .8), vy: rnd(-.8, .8), life: 0.4, rgb: DEP[p.kind].rgb });
      deposits.splice(k, 1); continue;
    }
  }
  for (const kind in DEP) {
    spawnT[kind] -= dt;
    if (spawnT[kind] <= 0) {
      spawnT[kind] = spawnEvery[kind]();
      if (deposits.filter(d => d.kind === kind).length < spawnTarget(kind)) {
        deposits.push(spawnDeposit(kind));
        if (kind === 'bloom' && !S.flags.bloomSeen) { S.flags.bloomSeen = 1; log('sys', 'MOBILE NUTRIENT. PURSUE.'); }
        if (kind === 'cell' && !S.flags.cellSeen) { S.flags.cellSeen = 1; log('sys', 'DEAD CELL. RICH. LOUD.'); }
      }
    }
  }
  for (let i = crumbs.length - 1; i >= 0; i--) { const c = crumbs[i]; c.life -= dt; c.x += c.vx; c.y += c.vy; if (c.life <= 0) crumbs.splice(i, 1); }
}
let crumbs = [];
function initWorld() {
  bots = []; syncBots();
  for (const b of bots) { const p = inDish(14); b.x = p.x; b.y = p.y; }
  deposits = []; crumbs = [];
  for (let i = 0; i < 10; i++) { const d = spawnDeposit('speck'); d.age = 1; deposits.push(d); }
  for (let i = 0; i < 3; i++) { const d = spawnDeposit('crystal'); d.age = 1; deposits.push(d); }
  rival = null; if (S.rival === 'active') spawnRival();
}

const GS = 4, GW = Math.ceil(W / GS), GH = Math.ceil(H / GS);
let head = new Int32Array(GW * GH), nxt = new Int32Array(64);

function physicsStep(touchCounts) {
  const n = bots.length;
  if (nxt.length < n) nxt = new Int32Array(n * 2);
  head.fill(-1);
  for (let i = 0; i < n; i++) {
    const b = bots[i]; const gx = Math.min(GW - 1, Math.max(0, b.x / GS | 0)), gy = Math.min(GH - 1, Math.max(0, b.y / GS | 0));
    const c = gy * GW + gx; nxt[i] = head[c]; head[c] = i;
  }
  const cen = centroid();
  const heavy = Math.pow(0.97, n / 100);   // bigger swarm, heavier feel
  const tx = target.x, ty = target.y;
  let touching = 0;
  for (let i = 0; i < n; i++) {
    const b = bots[i];
    if (S.dormant) { b.vx *= 0.8; b.vy *= 0.8; b.x += b.vx; b.y += b.vy; continue; }
    let sx = 0, sy = 0, ax = 0, ay = 0, cnt = 0;
    const gx = b.x / GS | 0, gy = b.y / GS | 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const X = gx + ox, Y = gy + oy; if (X < 0 || Y < 0 || X >= GW || Y >= GH) continue;
      for (let j = head[Y * GW + X]; j !== -1; j = nxt[j]) {
        if (j === i) continue; const o = bots[j];
        const dx = b.x - o.x, dy = b.y - o.y, d2 = dx * dx + dy * dy;
        if (d2 < 16) { cnt++; ax += o.vx; ay += o.vy;
          const sep = b.tier ? LEADERS[b.tier === 1 ? 'fore' : 'coord'].sep : SWARM[b.lvl || 'loose'].sep;
          if (d2 < sep * sep && d2 > 0.0001) { const d = Math.sqrt(d2); sx += dx / d * (sep - d); sy += dy / d * (sep - d); } }
      }
    }
    b.n = cnt;
    const P = b.tier ? LEADERS[b.tier === 1 ? 'fore' : 'coord'] : SWARM[b.lvl || 'loose'], eat = SWARM[b.lvl || 'loose'].eat;
    let fx = sx * 0.12 + (cen.x - b.x) * P.coh, fy = sy * 0.12 + (cen.y - b.y) * P.coh;
    if (cnt) { fx += (ax / cnt - b.vx) * 0.05; fy += (ay / cnt - b.vy) * 0.05; }
    if (b.leader >= 0 && bots[b.leader]) {
      const L = bots[b.leader], dx = L.x - b.x, dy = L.y - b.y, d = Math.hypot(dx, dy) || 1;
      const want = b.tier === 1 ? P.ring : P.orbit, k = b.tier === 1 ? P.ringK : P.orbitK;
      fx += dx / d * (d - want) * k - dy / d * 0.03; fy += dy / d * (d - want) * k + dx / d * 0.03;
      fx += (tx - b.x) * P.pull * 0.5; fy += (ty - b.y) * P.pull * 0.5;
    } else {
      fx += (tx - b.x) * P.pull; fy += (ty - b.y) * P.pull;
    }
    b.wa += rnd(-0.25, 0.25);
    fx += Math.cos(b.wa) * P.wander + rnd(-P.jit, P.jit); fy += Math.sin(b.wa) * P.wander + rnd(-P.jit, P.jit);
    b.vx = b.vx * 0.9 + fx; b.vy = b.vy * 0.9 + fy;
    const sp = Math.hypot(b.vx, b.vy), cap = Math.max(0.4, P.maxV * heavy);
    if (sp > cap) { b.vx *= cap / sp; b.vy *= cap / sp; }
    b.x += b.vx; b.y += b.vy;
    const rx = b.x - CX, ry = b.y - CY, rr = Math.hypot(rx, ry);
    if (rr > DISH - 2 && !S.ended) { b.x = CX + rx / rr * (DISH - 2); b.y = CY + ry / rr * (DISH - 2); b.vx *= -0.3; b.vy *= -0.3; }
    // contact
    for (let k = 0; k < deposits.length; k++) {
      const p = deposits[k]; if (p.hp <= 0) continue;
      const dx = b.x - p.x, dy = b.y - p.y, f = p.r + MATTER.contact;
      if (dx * dx + dy * dy < f * f) { touching += DEP[p.kind].yield; touchCounts[k] += eat * MATTER.eat; b.harv = 1; break; }
    }
  }
  return n ? touching / n : 0;
}

// ---------- Rival cluster ----------
function spawnRival() {
  const a = rnd(0, Math.PI * 2);
  rival = { x: CX + Math.cos(a) * 70, y: CY + Math.sin(a) * 70, n: 24, absorb: 0, pts: Array.from({ length: 24 }, () => ({ x: rnd(-5, 5), y: rnd(-5, 5) })) };
}
function updateRival(dt) {
  if (!rival) return;
  let best = null, bd = 1e9;
  for (const p of deposits) { if (p.hp <= 0) continue; const d = Math.hypot(p.x - rival.x, p.y - rival.y) - (p.kind === 'crystal' ? 30 : 0); if (d < bd) { bd = d; best = p; } }
  if (best) {
    const dx = best.x - rival.x, dy = best.y - rival.y, d = Math.hypot(dx, dy) || 1;
    if (d > best.r) { rival.x += dx / d * 0.35 * dt * 60; rival.y += dy / d * 0.35 * dt * 60; }
    else best.hp -= rival.n * 0.6 * dt;
  }
  for (const p of rival.pts) { p.x = Math.max(-6, Math.min(6, p.x + rnd(-.6, .6))); p.y = Math.max(-6, Math.min(6, p.y + rnd(-.6, .6))); }
  let near = 0; for (const b of bots) if (Math.hypot(b.x - rival.x, b.y - rival.y) < 16) near++;
  const need = Math.max(30, Math.ceil(rival.n * 1.5));
  rival.near = near; rival.need = need;
  if (near >= need && !S.dormant) rival.absorb += dt; else rival.absorb = Math.max(0, rival.absorb - dt * 0.5);
  if (rival.absorb >= 3) {
    S.D += rival.n; S.rival = 'absorbed'; rival = null; syncBots();
    log('sys', 'FOREIGN CLUSTER: ASSIMILATED.'); log('sys', '+24 UNITS.');
    if (S.up.lattice) log('mind', 'now it is us.');
    buzz(40);
  }
}

// ---------- Light sweeps ----------
function startSweep() {
  const horiz = Math.random() < 0.5, dir = Math.random() < 0.5 ? 1 : -1;
  sweep = { horiz, dir, warn: 2, pos: dir > 0 ? -14 : (horiz ? H : W) + 14, speed: horiz ? 42 : 36, w: 22 };
}
function updateSweep(dt) {
  if (!sweep) {
    if (!S.meter || S.ended) return;
    nextSweep -= dt; if (nextSweep <= 0) { startSweep(); nextSweep = S.breach ? rnd(18, 28) : rnd(35, 55);
      showTip('beam', 'BEAM INCOMING', ['The <b>red dashed edge</b> marks where a microscope beam will sweep across the dish.', 'Every bot the beam touches raises <b>Observation</b>. Move the swarm out of its path, or go <i>DORMANT</i>.']); }
    return;
  }
  if (sweep.warn > 0) { sweep.warn -= dt; return; }
  sweep.pos += sweep.dir * sweep.speed * dt;
  const lim = sweep.horiz ? H : W;
  if ((sweep.dir > 0 && sweep.pos > lim + 14) || (sweep.dir < 0 && sweep.pos < -14)) { sweep = null; return; }
  if (S.dormant) return;
  let inBeam = 0;
  for (const b of bots) {
    const v = sweep.horiz ? b.y : b.x;
    if (Math.abs(v - sweep.pos) < sweep.w / 2) { inBeam++; b.flash = 0.25; }
  }
  if (inBeam) {
    S.O += Math.min(B.sweepCap, inBeam) * dt;
    S.sweepHits += dt;
    if (S.up.lattice && !S.flags.lightBad) { S.flags.lightBad = 1; log('mind', 'light. bad.'); }
    if (!S.flags.beamNote) { S.flags.beamNote = 1; log('lab', 'beam scan running. 400x.'); }
  }
}

// ---------- Economy ----------
function baseRate() {
  const S_ = Math.min(S.D, B.span * S.F), U = S.D - S_;
  return (1 + B.droneRate * U + B.droneRate * B.supMult * S_ + B.foremanRate * S.F) * (S.up.lattice ? 2 : 1) * Math.pow(B.coordMult, S.C);
}
let liveRate = 0, autoT = 0;
function econ(dt, E) {
  if (S.ended) return;
  if (!S.dormant) {
    Esm += (E - Esm) * Math.min(1, dt * 2);
    const eff = S.up.optical ? Esm : textEff();
    liveRate = baseRate() * eff;
    S.m += liveRate * dt; S.harvested += liveRate * dt;
    if (!S.up.optical) textTick(dt, liveRate * dt);
    if (S.up.selfasm) {
      const g = B.obsK * Math.sqrt(B.wD * S.D + B.wF * S.F + B.wC * S.C) * (S.up.thermal ? B.thermal : 1);
      S.O += g * dt;
    }
    autoT += dt;
    if (S.up.selfasm && autoT >= B.autoInterval && droneCost() <= B.autoFrac * S.m) { S.m -= droneCost(); S.D++; autoT = 0; syncBots(); }
  } else {
    liveRate = 0;
    S.O = Math.max(0, S.O - B.dormDrain * dt); S.dormT += dt;
  }
  if (!S.up.optical) story();
  // Notes and thresholds
  if (!S.meter && S.O >= B.meterAt) { S.meter = true; note(30);
    showTip('obs', 'THE LAB IS WATCHING', ['<b>Observation</b> is the lab noticing sample 7. It rises with swarm size, and fast when a beam touches you.',
      'Merged units are quieter: a foreman counts less than its 10 drones.', 'At <b>100%</b> the lab sterilizes the dish: you lose <b>half your drones and half your matter</b>.',
      'Go <i>DORMANT</i> to stop harvesting and drain it 3% per second.']); }
  if (S.O >= 60) note(60);
  if (S.O >= 85) note(85);
  if (S.O >= 100) purge();
  if (S.everC && S.rival === 'none' && S.t - S.coordAt > 45) { S.rival = 'active'; spawnRival(); log('lab', 'second colony in sample 7??'); if (S.up.lattice) log('mind', 'another. it is not us.'); }

const SIG = { trace: { label: 'TRACE ORGANICS', short: 'TRACE', E: 0.55, amt: [15, 30] }, mass: { label: 'DENSE MASS', short: 'MASS', E: 0.95, amt: [50, 90] },

function textEff() {

    return { id, kind: k, E: g.E, left: Math.round(rnd(g.amt[0], g.amt[1])), dist: 1 + Math.floor(Math.random() * 6), dir: dirs[Math.floor(Math.random() * 8)] }; });

// ---------- Breach: bore through the rim ----------
function crackPos(r) { const a = S.breach.a, d = r === undefined ? DISH - 3 : r; return { x: CX + Math.cos(a) * d, y: CY + Math.sin(a) * d }; }

// ---------- Render ----------
function draw(dt) {
  ctx.fillStyle = '#040706'; ctx.fillRect(0, 0, W, H);
  // dish
  ctx.strokeStyle = 'rgba(183,196,193,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, DISH, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(183,196,193,0.04)';
  ctx.beginPath(); ctx.moveTo(CX, CY - DISH); ctx.lineTo(CX, CY + DISH); ctx.moveTo(CX - DISH, CY); ctx.lineTo(CX + DISH, CY); ctx.stroke();
  // deposits
  const now = performance.now() / 1000;
  for (const p of deposits) {
    const T = DEP[p.kind];
    let a = 0.9;
    if (p.kind === 'bloom') a *= 0.75 + 0.25 * Math.sin(now * 5 + p.seed);
    const grow = Math.min(1, p.age / 0.4);
    if (p.kind === 'cell') { ctx.strokeStyle = `rgba(${T.rgb},${0.35 * a * grow})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * grow, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = `rgba(${T.rgb},${a})`;
    const shown = Math.ceil(p.grains.length * grow);
    for (let i = 0; i < shown; i++) { const g = p.grains[i]; ctx.fillRect(Math.round(p.x + g.x * grow), Math.round(p.y + g.y * grow), 1, 1); }
    if (p.kind === 'crystal' && p.grains.length > 6) { ctx.fillStyle = `rgba(250,248,236,${a})`; ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 2, 2); }
  }
  for (const c of crumbs) { ctx.fillStyle = `rgba(${c.rgb},${Math.min(1, c.life * 3)})`; ctx.fillRect(Math.round(c.x), Math.round(c.y), 1, 1); }

  if (sweep) {
    if (sweep.warn > 0) {
      const on = Math.floor(sweep.warn * 6) % 2 === 0;
      if (on) { ctx.fillStyle = 'rgba(224,68,58,0.8)';
        const edge = sweep.dir > 0 ? 1 : (sweep.horiz ? H - 2 : W - 2);
        for (let i = 0; i < (sweep.horiz ? W : H); i += 4) sweep.horiz ? ctx.fillRect(i, edge, 2, 1) : ctx.fillRect(edge, i, 1, 2); }
    } else {
      ctx.fillStyle = 'rgba(224,68,58,0.12)';
      if (sweep.horiz) ctx.fillRect(0, sweep.pos - sweep.w / 2, W, sweep.w); else ctx.fillRect(sweep.pos - sweep.w / 2, 0, sweep.w, H);
      ctx.fillStyle = 'rgba(224,68,58,0.55)';
      const lead = sweep.pos + sweep.dir * sweep.w / 2;
      if (sweep.horiz) ctx.fillRect(0, Math.round(lead), W, 1); else ctx.fillRect(Math.round(lead), 0, 1, H);
    }
  }
  // weak point in the rim
  if (S.breach) {
    const c = crackPos(), pr = S.breach.prog, a = S.breach.a;
    ctx.strokeStyle = `rgba(166,255,246,${0.18 + 0.12 * Math.sin(performance.now() / 300)})`;
    ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.arc(c.x, c.y, 14, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(166,255,246,0.9)'; ctx.beginPath(); ctx.arc(c.x, c.y, 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pr); ctx.stroke();
    ctx.fillStyle = `rgba(240,255,252,${0.5 + 0.5 * pr})`;
    const len = 3 + pr * 14, nx = -Math.cos(a), ny = -Math.sin(a), tx_ = -ny, ty_ = nx;
    for (let i = 0; i < len; i++) { const j = Math.sin(i * 2.3 + a * 7) * 1.5; ctx.fillRect(Math.round(c.x + nx * i + tx_ * j), Math.round(c.y + ny * i + ty_ * j), 1, 1); }
    for (let i = 0; i < len * 0.5; i++) { ctx.fillRect(Math.round(c.x + nx * i * 0.6 + tx_ * i * 0.5), Math.round(c.y + ny * i * 0.6 + ty_ * i * 0.5), 1, 1); }
  }
  // rival
  if (rival) {
    const flick = Math.random() < 0.15;
    ctx.fillStyle = flick ? 'rgba(255,180,170,0.9)' : 'rgba(224,68,58,0.85)';
    for (const p of rival.pts) ctx.fillRect(Math.round(rival.x + p.x + (Math.random() < .05 ? rnd(-3, 3) : 0)), Math.round(rival.y + p.y), 1, 1);
    if (rival.absorb > 0) {
      ctx.strokeStyle = `rgba(166,255,246,${0.3 + rival.absorb / 4})`;
      ctx.beginPath(); ctx.arc(rival.x, rival.y, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, rival.absorb / 3)); ctx.stroke();

  // bots
  for (const b of bots) {
    const x = Math.round(b.x), y = Math.round(b.y);
    let col;
    if (b.flash > 0) { col = '#e0443a'; b.flash -= dt; }
    else if (S.dormant) col = '#26302f';
    else if (b.tier === 2) col = '#ffffff';
    else if (b.tier === 1) col = '#d6fffb';

    if (b.tier === 2) { ctx.fillStyle = S.dormant ? 'rgba(80,90,90,0.15)' : 'rgba(166,255,246,0.10)'; ctx.beginPath(); ctx.arc(b.x, b.y, LEADERS.coord.halo, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = col;
    if (b.tier) { const z = LEADERS[b.tier === 1 ? 'fore' : 'coord'].size, o = Math.floor((z - 1) / 2); ctx.fillRect(x - o, y - o, z, z); } else ctx.fillRect(x, y, 1, 1);
    if (b.harv && !S.dormant) { ctx.fillStyle = 'rgba(214,204,168,0.25)'; ctx.fillRect(x - Math.sign(b.vx), y - Math.sign(b.vy), 1, 1); }
    b.harv = 0;
  }
  // rings

  }

    const k = Math.max(0, revealT / 2);
    ctx.fillStyle = `rgba(4,7,6,${k * 0.9})`; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 2500 * k; i++) { ctx.fillStyle = Math.random() < .5 ? '#5a6869' : '#1a2526'; ctx.fillRect(Math.random() * W | 0, Math.random() * H | 0, 1, 1); }
  }
}

    }
  }
  const set = (id, v, en, cls) => { const b = $(id); if (!b) return; b.querySelector('.v').textContent = v; b.disabled = !en; b.classList.toggle('ok', !!en && cls !== 'none'); };
  set('aHarvest', '+1', true, 'none');
  set('aStatus', '', true, 'none');
  set('aBuild', fmt(droneCost()), S.m >= droneCost() && !S.dormant && !S.ended);
  const opt = UPG[0];
  set('aOptical', S.D >= 5 ? fmt(opt.cost) : '5 DRONES', S.m >= opt.cost && opt.req());
  const cd = v => v > 0 ? `${Math.ceil(v)}s` : '';
  set('aScan', cd(T.cdS), T.cdS <= 0, 'none'); set('aListen', cd(T.cdL), T.cdL <= 0, 'none'); set('aProbe', cd(T.cdP), T.cdP <= 0, 'none');
  for (const g of T.signals) {
    const here = T.seek === g.id;
    set('aSeek' + g.id, here ? (T.transit > 0 ? `→ ${Math.ceil(T.transit)}s` : `${Math.max(0, Math.ceil(g.left))} left`) : `${SIG[g.kind].short} ${g.dist}µm`, !here, here ? 'none' : '');
    const bt = $('aSeek' + g.id); if (bt) bt.classList.toggle('on', here);
  }
  set('aForeman', `10 + ${fmt(foremanCost())}`, canForeman());
  set('aCoord', `5F + ${fmt(coordCost())}`, canCoord());
  const d = $('aDorm');
  if (d) {
    d.querySelector('.k').textContent = S.dormant ? 'WAKE' : 'DORMANT';
    d.querySelector('.v').textContent = S.dormant ? (S.dormT < B.dormMin ? `${Math.ceil(B.dormMin - S.dormT)}s` : 'ready') : '';
    d.disabled = (S.dormant && S.dormT < B.dormMin) || S.ended;
    d.classList.toggle('on', S.dormant);
    d.classList.toggle('pulse', !S.dormant && S.O >= 60 && prefs.motion);
    d.classList.toggle('ok', false);
  }
}
function status() {
  log('sys', `UNITS: ${S.D + 1}. MATTER: ${Math.floor(S.m)}.`);
  log('sys', `YIELD: ${fmt(liveRate)}/S. SIGHT: NONE.`);
  log('sys', S.tx.seek ? `FEEDING ON SIGNAL ${S.tx.seek}.` : 'DRIFTING. YIELD LOW.');
}
function availableCount() { return UPG.filter(u => u.show() && !S.up[u.id] && u.req() && S.m >= u.cost).length; }
let cardKey = '';
function renderCards() {
  const vis = UPG.filter(u => u.show());
  const key = vis.map(u => u.id + (S.up[u.id] ? 1 : 0)).join();
  const box = $('cards');
  if (key !== cardKey) {
    cardKey = key; box.replaceChildren();
    for (const u of vis) {
      const c = document.createElement('div'); c.className = 'card' + (S.up[u.id] ? ' done' : ''); c.id = 'card-' + u.id;
      c.innerHTML = `<h3></h3><p class="fx"></p><p class="flavor"></p><p class="req"></p><button class="buy${u.final ? ' final' : ''}"></button>`;
      c.querySelector('h3').textContent = u.name; c.querySelector('.fx').textContent = u.fx; c.querySelector('.flavor').textContent = u.flavor;
      c.querySelector('button').onclick = () => buyUpgrade(u.id);
      box.append(c);
    }
  }
  for (const u of vis) {
    const c = $('card-' + u.id); if (!c) continue;
    const b = c.querySelector('button'), r = c.querySelector('.req');
    if (S.up[u.id]) { b.textContent = 'INSTALLED'; b.disabled = true; r.textContent = ''; continue; }
    b.textContent = u.cost ? fmt(u.cost) : 'FREE'; b.disabled = !(u.req() && S.m >= u.cost) || S.dormant || S.ended;
    r.textContent = u.req() ? '' : u.reqText; r.classList.toggle('unmet', !u.req());
  }
  const n = availableCount();
  $('upDot').hidden = !(n > 0 && $('upgrades').hidden);
}
function update() {
  $('mVal').textContent = fmt(S.m);
  $('rVal').textContent = fmt(liveRate);
  $('unitsLbl').innerHTML = `<b>${S.D + 1}</b> DRONE${S.D ? 'S' : ''}` + (S.F || S.everF ? ` · <b>${S.F}</b> FORE` : '') + (S.C || S.everC ? ` · <b>${S.C}</b> COORD` : '');
  $('obsRow').hidden = !S.meter;
  if (S.meter) {
    const o = Math.min(100, S.O);
    $('obsFill').style.width = o + '%'; $('obsPct').textContent = Math.floor(o) + '%';
    $('obsRow').classList.toggle('hot', o >= 85);
    $('obsRate').textContent = (S.dormant ? '−' : oRate >= 0 ? '+' : '−') + Math.abs(S.dormant ? B.dormDrain : oRate).toFixed(1) + '/s';
  }
  const eta = (!S.dormant && S.O >= 70 && oRate > 0.05) ? Math.ceil((100 - S.O) / oRate) : null;
  $('frame').classList.toggle('danger', eta !== null && S.O >= 85);
  const st = $('scopeState');
  if (st) {
    let txt = '', cls = '';
    if (S.dormant) { txt = 'DORMANT'; cls = 'dorm'; }
    else if (sweep && sweep.warn > 0) { txt = 'BEAM INCOMING'; cls = 'warn'; }
    else if (eta !== null) { txt = `PURGE IN ${eta}s`; cls = 'warn'; }
    else if (S.breach && !S.ended) txt = `BORING ${Math.floor(S.breach.prog * 100)}% · ${S.breach.w || 0}/${B.boreNeed}`;
    else if (rival) { txt = `ASSIMILATE ${Math.min(rival.near || 0, rival.need || 30)}/${rival.need || 30}`; }
    else if (S.up.optical) txt = `YIELD ${Math.round(Esm * 100)}%`;
    st.textContent = txt; st.className = 'overlay-label ol-tr ' + cls;
  }
  renderActions(); renderCards();
}

// ---------- Input ----------
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
let dragging = false;
cv.addEventListener('pointerdown', e => { if (S.ended) return; dragging = true; cv.setPointerCapture(e.pointerId); const p = toLogical(e); target = { ...p, set: true }; if (!S.flags.steer) { S.flags.steer = 1; } });
cv.addEventListener('pointermove', e => { if (!dragging || S.ended) return; const p = toLogical(e); target = { ...p, set: true }; });
const endDrag = () => { dragging = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
for (const t of document.querySelectorAll('.tab')) t.onclick = () => selectTab(t.dataset.tab);
$('ticker').onclick = () => selectTab('logfull');
$('gearBtn').onclick = () => { $('settings').hidden = false; $('resetConfirm').hidden = true; syncSeg(); };
$('closeSet').onclick = () => { $('settings').hidden = true; };
$('settings').onclick = e => { if (e.target.id === 'settings') $('settings').hidden = true; };
function syncSeg() {
  for (const [seg, val] of [['motionSeg', prefs.motion ? 'on' : 'off'], ['textSeg', String(prefs.text)], ['speedSeg', String(prefs.speed)]])
    for (const b of $(seg).querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.v === val);
}
$('motionSeg').onclick = e => { const v = e.target.dataset.v; if (!v) return; prefs.motion = v === 'on'; applyPrefs(); };
$('textSeg').onclick = e => { const v = e.target.dataset.v; if (!v) return; prefs.text = +v; applyPrefs(); };
$('speedSeg').onclick = e => { const v = e.target.dataset.v; if (!v) return; prefs.speed = +v; applyPrefs(); };
function applyPrefs() { document.body.classList.toggle('flicker', prefs.motion); document.documentElement.style.setProperty('--log-size', prefs.text + 'px'); syncSeg(); savePrefs(); }
let resetArmed = false;
$('resetBtn').onclick = () => {
  if (!resetArmed) { resetArmed = true; $('resetConfirm').hidden = false; setTimeout(() => { resetArmed = false; $('resetConfirm').hidden = true; }, 4000); return; }
  restart(); $('settings').hidden = true;
};
for (const b of document.querySelectorAll('.choices button')) b.onclick = () => showEpilogue(b.dataset.c);
$('againBtn').onclick = () => { $('endSheet').hidden = true; restart(); };
function restart() {
  S = fresh(); resetArmed = false; oRate = 0; tipQ.length = 0; $('tip').hidden = true; $('banner').hidden = true; actionKey = ''; cardKey = ''; sweep = null; nextSweep = 40; Esm = 0; particles = [];
  target = { x: CX, y: CY, set: false }; initWorld(); boot(); save();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
addEventListener('resize', fitCanvas);

// ---------- Loop ----------
let last = performance.now(), uiT = 0, saveT = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  const dt = real * prefs.speed;
  const paused = !$('tip').hidden;
  if (paused) { if (S.up.optical) draw(0); }
  else if (!S.ended || breachT < 3) {
    const O0 = S.O, P0 = S.purges;
    S.t += S.ended ? 0 : dt;
    const touch = new Array(deposits.length).fill(0);
    const steps = Math.max(1, Math.round(dt * 60));
    let E = 0;
    const touchSum = new Array(deposits.length).fill(0);
    for (let i = 0; i < steps; i++) { touch.fill(0); E = physicsStep(touch); for (let k = 0; k < deposits.length; k++) { deposits[k].hp -= touch[k] / 60; touchSum[k] += touch[k]; } }
    updateDeposits(dt, touchSum);
    if (!S.ended) { econ(dt, E); updateSweep(dt); updateRival(dt); updateBore(dt);
      if (dt > 0 && S.purges === P0 && S.up.selfasm) oRate += ((S.O - O0) / dt - oRate) * Math.min(1, dt * 1.5); }
    else breachT += real;
    if (S.up.optical) draw(real);
  }
  uiT += real; if (uiT > 0.1) { uiT = 0; update(); }
  saveT += real; if (saveT > 10) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}

function boot() {
  applyPrefs();
  if (!S.logs.length) { log('sys', 'UNIT 0001: DIRECTIVE IGNORED.'); log('sys', 'HARVEST. BUILD. CONTINUE.'); }
  renderLogs(false); layoutPhase(); update();
  if (S.ended) showEnd();
}
window.__ms = { get S() { return S; }, get deps() { return deposits; }, get E() { return Esm; }, get bots() { return bots.length; }, get cen() { return centroid(); }, crack: () => S.breach && crackPos(), steer: (x, y) => { target = { x, y, set: true }; } };
initWorld(); boot();
requestAnimationFrame(frame);
})();
</script>
